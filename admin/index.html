<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم | وهج</title>
<link rel="icon" type="image/png" href="/assets/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/admin.css">
<script src="/assets/admin-config.js"></script>
<script src="/assets/admin.js" defer></script>
<script src="/assets/admin-data.js" defer></script>
<script src="/assets/admin-lists.js" defer></script>
<script src="/assets/admin-sales.js" defer></script>
<script src="/assets/admin-team.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="a-home" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="a-page" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></g></symbol>
  <symbol id="a-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></g></symbol>
  <symbol id="a-tag" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></g></symbol>
  <symbol id="a-gift" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="8" width="18" height="5" rx="1"/><path d="M5 13v8h14v-8M12 8v13M12 8S10.5 3 8 4s-1 4 4 4c5 0 6.5-3 4-4s-4 4-4 4"/></g></symbol>
  <symbol id="a-doc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></g></symbol>
  <symbol id="a-inbox" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/></g></symbol>
  <symbol id="a-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.6 3 5.2"/></g></symbol>
  <symbol id="a-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></g></symbol>
  <symbol id="a-star" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8l-5.5 2.9 1.2-6.1-4.5-4.2 6.1-.8z"/></symbol>
  <symbol id="a-img" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></g></symbol>
  <symbol id="a-pc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g></symbol>
  <symbol id="a-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></g></symbol>
  <symbol id="a-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10"/></symbol>
  <symbol id="a-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="a-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="a-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14l-5-5 5-5M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
</svg>

<!-- sign in -->
<section class="ad-login" id="ad-login" hidden>
  <form class="ad-login__card" id="ad-login-form" novalidate>
    <img src="/assets/logo.webp" alt="وهج لخدمات التنظيف" class="ad-login__logo">
    <h1>لوحة التحكم</h1>
    <p class="ad-demo-note" id="ad-demo-note" hidden>وضع تجربة: ادخل بأي إيميل وأي كلمة مرور. التعديلات بتتحفظ على الجهاز ده بس، والموقع الحقيقي مابيتغيرش.</p>
    <label class="ad-field"><span>الإيميل</span><input type="email" id="ad-email" autocomplete="username" dir="ltr" required></label>
    <label class="ad-field"><span>كلمة المرور</span><input type="password" id="ad-pass" autocomplete="current-password" dir="ltr" required></label>
    <p class="ad-err" id="ad-login-err" role="alert" hidden></p>
    <button class="ad-btn ad-btn--primary ad-btn--wide" type="submit" id="ad-login-btn">دخول</button>
    <button class="ad-link" type="button" id="ad-forgot">نسيت كلمة المرور؟</button>
  </form>
</section>

<!-- app -->
<div class="ad-app" id="ad-app" hidden>
  <aside class="ad-side" id="ad-side">
    <div class="ad-side__brand"><img src="/assets/logo.webp" alt="وهج"><span>لوحة التحكم</span></div>
    <nav class="ad-nav" id="ad-nav" aria-label="أقسام اللوحة"></nav>
    <div class="ad-side__user"><span id="ad-user"></span><button class="ad-iconbtn" type="button" id="ad-logout" aria-label="تسجيل الخروج"><svg><use href="#a-out"/></svg></button></div>
  </aside>
  <div class="ad-scrim" id="ad-scrim" hidden></div>

  <main class="ad-main">
    <header class="ad-top">
      <button class="ad-iconbtn ad-top__menu" type="button" id="ad-menu" aria-label="القائمة"><svg><use href="#a-menu"/></svg></button>
      <h2 id="ad-title">الرئيسية</h2>
      <span class="ad-demo" id="ad-demo" hidden>وضع تجربة</span>
      <div class="ad-top__act">
        <button class="ad-pill" type="button" id="ad-pend" hidden></button>
        <button class="ad-btn ad-btn--ghost" type="button" id="ad-discard" hidden>إلغاء التعديلات</button>
        <button class="ad-btn ad-btn--primary" type="button" id="ad-publish" disabled>انشر التعديلات</button>
      </div>
    </header>
    <div class="ad-view" id="ad-view"></div>
  </main>
</div>

<!-- pending changes -->
<div class="ad-drawer" id="ad-changes" hidden>
  <div class="ad-drawer__bg" data-close></div>
  <div class="ad-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="ad-ch-h">
    <div class="ad-drawer__head"><h3 id="ad-ch-h">تعديلات لم تُنشر</h3><button class="ad-iconbtn" type="button" data-close aria-label="إغلاق">×</button></div>
    <ul class="ad-changes" id="ad-ch-list"></ul>
  </div>
</div>

<!-- image picker -->
<div class="ad-modal" id="ad-img" hidden>
  <div class="ad-modal__bg" data-close></div>
  <div class="ad-modal__card" role="dialog" aria-modal="true" aria-labelledby="ad-img-h">
    <h3 id="ad-img-h">تغيير الصورة</h3>
    <div class="ad-img__cmp">
      <figure><img id="ad-img-old" alt=""><figcaption>الحالية</figcaption></figure>
      <figure><div class="ad-img__new" id="ad-img-new"><svg><use href="#a-img"/></svg><span>اختر صورة</span></div><figcaption id="ad-img-info">الجديدة</figcaption></figure>
    </div>
    <input type="file" id="ad-img-file" accept="image/*" hidden>
    <button class="ad-btn ad-btn--ghost ad-btn--wide" type="button" id="ad-img-pick"><svg><use href="#a-img"/></svg>اختر صورة من جهازك</button>
    <label class="ad-field"><span>وصف الصورة <em>(لجوجل وقارئ الشاشة)</em></span><input type="text" id="ad-img-alt"></label>
    <p class="ad-err" id="ad-img-err" hidden></p>
    <div class="ad-modal__act"><button class="ad-btn ad-btn--ghost" type="button" data-close>إلغاء</button><button class="ad-btn ad-btn--primary" type="button" id="ad-img-ok">تطبيق</button></div>
  </div>
</div>

<div class="ad-toast" id="ad-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
