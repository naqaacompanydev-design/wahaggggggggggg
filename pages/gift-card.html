<!--body-->
<main id="main" class="gcp">
  <!--ICONS-->
  <div class="gcp__in">
    <span class="gcp__demo" hidden>هذا مثال لكارت الإهداء</span>
    <h1 class="gcp__hi" data-gc="hi">وصلتك هدية 🎁</h1>
    <p class="gcp__sub" data-gc="sub">اضغط على الصندوق وافتحها.</p>

    <div class="gcp__stage">
      <div class="gconf" aria-hidden="true"></div>
      <button type="button" class="gbox" aria-label="افتح الهدية">
        <span class="gbox__base"></span><span class="gbox__rib"></span>
        <span class="gbox__lid"><span class="gbox__bow"></span></span>
        <span class="gbox__hint">اضغط لفتح هديتك</span>
      </button>
      <div class="gcp__card" aria-hidden="true">
        <article class="gc" tabindex="-1" aria-label="كارت الإهداء">
          <svg class="gc__sp gc__sp--a" aria-hidden="true"><use href="#i-spark"/></svg><svg class="gc__sp gc__sp--b" aria-hidden="true"><use href="#i-spark"/></svg><svg class="gc__sp gc__sp--c" aria-hidden="true"><use href="#i-spark"/></svg>
          <div class="gc__top"><img src="/assets/logo.webp" alt="وهج لخدمات التنظيف"><span class="gc__tag">كارت إهداء</span></div>
          <div class="gc__em" data-gc="emoji" aria-hidden="true">🎁</div>
          <p class="gc__occ" data-gc="title"></p>
          <h2 class="gc__to">إلى <span data-gc="to"></span></h2>
          <blockquote class="gc__msg" data-gc="msg"></blockquote>
          <p class="gc__from">مع حبي، <b data-gc="from"></b></p>
          <div class="gc__gift"><small>هديتك من وهج لخدمات التنظيف</small><ul data-gc="svcs"></ul></div>
          <p class="gc__date" data-gc="date"></p>
        </article>
      </div>
    </div>

    <div class="gcp__act">
      <a class="btn btn--wa" data-pick href="#" target="_blank" rel="noopener"><svg class="ico"><use href="#i-wa"/></svg>اختر موعدك على واتساب</a>
      <button type="button" class="btn btn--ghost" data-save>احفظ الكارت صورة</button>
      <p class="gcp__more">حاب تفرّح أحد بنفس الطريقة؟ <a href="/gift/">أهدِ نظافة</a></p>
    </div>
  </div>
